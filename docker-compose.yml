services:
  database:
    container_name: "topcv-database"
    image: postgres:17
    environment:
      POSTGRES_DB: topcv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - "./database/db-data:/var/lib/postgresql/data"
  redis: 
    container_name: "topcv-redis"
    image: redis:8.10.1
    ports:
      - 6379:6379
    volumes:
      - "./redis/redis-data:/data"