name: topcv-production
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  database:
    <<: *service
    image: postgres:17
    environment:
      POSTGRES_DB: topcv
      POSTGRES_USER: topcv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topcv -d topcv"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    <<: *service
    image: redis:8.10.1
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    <<: *service
    build: ./backend
    image: topcv-backend:local
    env_file: ./deploy/backend.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *service
    image: topcv-backend:local
    env_file: ./deploy/backend.env
    command: ["npm", "run", "worker:start"]
    depends_on:
      api:
        condition: service_healthy
  frontend:
    <<: *service
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_API: https://api.topcv.dev
        NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL:?Set public image URL}
    environment:
      NEXT_PUBLIC_BACKEND_API: https://api.topcv.dev
      NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL}
    depends_on:
      api:
        condition: service_healthy
  caddy:
    <<: *service
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
